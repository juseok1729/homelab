---
# ─────────────────────────────────────────────────────────────
# Common: swap 비활성화 + sysctl + containerd + k8s 패키지
# Ubuntu 템플릿에 이미 설치되어 있으나 idempotent하게 재적용
# ─────────────────────────────────────────────────────────────

- name: Disable swap immediately
  command: swapoff -a
  changed_when: false

- name: Remove swap entries from fstab
  replace:
    path: /etc/fstab
    regexp: '^([^#].*\s+swap\s+.*)$'
    replace: '#\1'

- name: Ensure kernel modules config exists
  copy:
    content: |
      overlay
      br_netfilter
    dest: /etc/modules-load.d/k8s.conf

- name: Load kernel modules
  modprobe:
    name: "{{ item }}"
  loop:
    - overlay
    - br_netfilter

- name: Ensure k8s sysctl config
  copy:
    content: |
      net.bridge.bridge-nf-call-iptables  = 1
      net.bridge.bridge-nf-call-ip6tables = 1
      net.ipv4.ip_forward                 = 1
    dest: /etc/sysctl.d/k8s.conf

- name: Apply sysctl
  command: sysctl --system
  changed_when: false

- name: Regenerate containerd config (SystemdCgroup=true, sandbox_image 명시, 1.x/2.x 호환)
  shell: |
    mkdir -p /etc/containerd
    containerd config default \
      | sed 's/SystemdCgroup = false/SystemdCgroup = true/g' \
      | sed 's|sandbox_image = ""|sandbox_image = "registry.k8s.io/pause:3.10"|g' \
      > /etc/containerd/config.toml
  changed_when: true

- name: Restart containerd to apply config
  service:
    name: containerd
    state: restarted
    enabled: true

- name: Ensure kubelet is enabled
  service:
    name: kubelet
    enabled: true
