---
- name: Ubuntu template post-install configuration
  hosts: all
  gather_facts: true

  tasks:
    - name: Wait for SSH
      wait_for_connection:
        delay: 5
        timeout: 120

    - name: Update apt cache
      apt:
        update_cache: true
        cache_valid_time: 3600

    - name: Upgrade all packages
      apt:
        upgrade: dist
        autoremove: true

    # ── containerd (Docker repo — newer than Ubuntu default) ──
    - name: Add Docker GPG key
      get_url:
        url: https://download.docker.com/linux/ubuntu/gpg
        dest: /etc/apt/keyrings/docker.asc
        mode: "0644"

    - name: Add Docker apt repo
      apt_repository:
        repo: >-
          deb [arch=amd64 signed-by=/etc/apt/keyrings/docker.asc]
          https://download.docker.com/linux/ubuntu
          {{ ansible_distribution_release }} stable
        state: present
        filename: docker

    - name: Install containerd.io
      apt:
        name: containerd.io
        state: present
        update_cache: true

    - name: Generate default containerd config with SystemdCgroup
      shell: |
        mkdir -p /etc/containerd
        containerd config default \
          | sed 's/SystemdCgroup = false/SystemdCgroup = true/' \
          > /etc/containerd/config.toml
      args:
        creates: /etc/containerd/config.toml

    - name: Enable containerd
      service:
        name: containerd
        state: started
        enabled: true

    # ── Kernel modules & sysctl (k8s 요구사항) ───────────────
    - name: Persist required kernel modules
      copy:
        content: |
          overlay
          br_netfilter
        dest: /etc/modules-load.d/k8s.conf

    - name: Load kernel modules now
      modprobe:
        name: "{{ item }}"
      loop:
        - overlay
        - br_netfilter

    - name: Set k8s sysctl params
      copy:
        content: |
          net.bridge.bridge-nf-call-iptables  = 1
          net.bridge.bridge-nf-call-ip6tables = 1
          net.ipv4.ip_forward                 = 1
        dest: /etc/sysctl.d/k8s.conf

    - name: Apply sysctl
      command: sysctl --system

    # ── Kubernetes packages ───────────────────────────────────
    - name: Add Kubernetes GPG key
      get_url:
        url: https://pkgs.k8s.io/core:/stable:/v1.32/deb/Release.key
        dest: /etc/apt/keyrings/kubernetes-apt-keyring.asc
        mode: "0644"

    - name: Add Kubernetes apt repo
      apt_repository:
        repo: >-
          deb [signed-by=/etc/apt/keyrings/kubernetes-apt-keyring.asc]
          https://pkgs.k8s.io/core:/stable:/v1.32/deb/ /
        state: present
        filename: kubernetes

    - name: Install kubeadm, kubelet, kubectl
      apt:
        name:
          - kubelet
          - kubeadm
          - kubectl
        state: present
        update_cache: true

    - name: Hold Kubernetes packages at current version
      dpkg_selections:
        name: "{{ item }}"
        selection: hold
      loop:
        - kubelet
        - kubeadm
        - kubectl

    - name: Enable kubelet
      service:
        name: kubelet
        enabled: true

    # ── SSH 경화 ──────────────────────────────────────────────
    - name: Disable password SSH auth (key-only after cloud-init)
      lineinfile:
        path: /etc/ssh/sshd_config
        regexp: "^#?PasswordAuthentication"
        line: "PasswordAuthentication no"
        state: present

    - name: Disable root SSH login
      lineinfile:
        path: /etc/ssh/sshd_config
        regexp: "^#?PermitRootLogin"
        line: "PermitRootLogin no"
        state: present

    # ── 검증 ─────────────────────────────────────────────────
    - name: Verify containerd is running
      command: pgrep containerd
      changed_when: false

    - name: Verify kubeadm installed
      command: kubeadm version
      changed_when: false

    - name: Report completion
      debug:
        msg: "Ubuntu template provisioning complete"
